<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>歯科電子治療ノート｜医院管理画面</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root {
    --bg:       #f0ede8;
    --surface:  #faf8f5;
    --card:     #ffffff;
    --border:   #d8d0c5;
    --text:     #1a1714;
    --muted:    #7a7068;
    --accent:   #2d6a4f;
    --accent2:  #e76f51;
    --danger:   #c1440e;
    --cavity:   #e63946;
    --treated:  #2d6a4f;
    --watch:    #f4a261;
    --crown:    #457b9d;
    --missing:  #6b7280;
    --r: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Zen Kaku Gothic New', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── ヘッダー ── */
  header {
    background: var(--accent);
    color: #fff;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
  }
  header svg { flex-shrink: 0; }
  header h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: .05em; }
  header small { font-size: .75rem; opacity: .75; }

  /* ── レイアウト ── */
  .layout {
    display: grid;
    grid-template-columns: 280px 1fr;
    min-height: calc(100vh - 54px);
  }

  /* ── サイドバー（患者リスト）── */
  .sidebar {
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
  }
  .sidebar-head {
    padding: 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .sidebar-head h2 { font-size: .85rem; color: var(--muted); font-weight: 500; }
  .search-box {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
  }
  .search-box input {
    border: none; outline: none; background: transparent;
    font-family: inherit; font-size: .9rem; width: 100%; color: var(--text);
  }
  .btn-add {
    display: flex; align-items: center; gap: 6px; justify-content: center;
    background: var(--accent); color: #fff;
    border: none; border-radius: 8px; padding: 8px 12px;
    font-family: inherit; font-size: .85rem; font-weight: 700; cursor: pointer;
    transition: opacity .15s;
  }
  .btn-add:hover { opacity: .85; }
  .patient-list { overflow-y: auto; flex: 1; }
  .patient-item {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background .12s;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .patient-item:hover { background: #ede8e0; }
  .patient-item.active { background: #d8ede3; border-left: 3px solid var(--accent); }
  .patient-item .pid { font-family: 'DM Mono', monospace; font-size: .75rem; color: var(--muted); }
  .patient-item .pname { font-weight: 700; font-size: .95rem; }
  .patient-item .plast { font-size: .75rem; color: var(--muted); }

  /* ── メインコンテンツ ── */
  .main {
    padding: 24px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .empty-state {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    color: var(--muted);
  }
  .empty-state svg { opacity: .3; }
  .empty-state p { font-size: .9rem; }

  /* ── 患者ヘッダー ── */
  .patient-header {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--r);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .patient-header .avatar {
    width: 48px; height: 48px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.3rem; font-weight: 700; flex-shrink: 0;
  }
  .patient-header .info h2 { font-size: 1.1rem; }
  .patient-header .info p  { font-size: .8rem; color: var(--muted); margin-top: 2px; }
  .patient-header .actions { margin-left: auto; display: flex; gap: 8px; }
  .btn {
    padding: 7px 14px; border-radius: 7px; border: 1.5px solid var(--border);
    font-family: inherit; font-size: .82rem; font-weight: 700; cursor: pointer;
    transition: all .15s; background: var(--card); color: var(--text);
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn.primary:hover { opacity: .85; }
  .btn.danger { background: var(--danger); color: #fff; border-color: var(--danger); }

  /* ── 歯式カード ── */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--r);
    padding: 20px;
  }
  .card-title {
    font-size: .8rem; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: .08em;
    margin-bottom: 14px;
    display: flex; align-items: center; gap: 6px;
  }

  /* 歯式 */
  .teeth-grid {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .teeth-row {
    display: flex;
    align-items: center;
    gap: 3px;
  }
  .teeth-label {
    font-size: .65rem; color: var(--muted);
    width: 22px; text-align: center;
    font-family: 'DM Mono', monospace;
  }
  .jaw-divider {
    width: 100%; height: 1px;
    background: var(--border);
    margin: 4px 0;
    position: relative;
  }
  .jaw-divider::after {
    content: '上 ↑  ↓ 下';
    position: absolute; left: 50%; transform: translateX(-50%);
    background: var(--card); padding: 0 8px;
    font-size: .65rem; color: var(--muted); top: -8px;
    white-space: nowrap;
  }
  .tooth {
    width: 30px; height: 36px;
    border: 1.5px solid var(--border);
    border-radius: 5px;
    cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: .6rem; font-weight: 700;
    transition: all .12s;
    position: relative;
    background: var(--card);
    color: var(--muted);
    user-select: none;
  }
  .tooth:hover { border-color: var(--accent); transform: scale(1.08); z-index: 2; }
  .tooth.deciduous { opacity: .6; font-style: italic; }
  .tooth[data-status="cavity"]  { background: #fde8e8; border-color: var(--cavity);  color: var(--cavity); }
  .tooth[data-status="treated"] { background: #e8f5ee; border-color: var(--treated); color: var(--treated); }
  .tooth[data-status="watch"]   { background: #fef3e2; border-color: var(--watch);   color: #a05a00; }
  .tooth[data-status="crown"]   { background: #e4f0f8; border-color: var(--crown);   color: var(--crown); }
  .tooth[data-status="missing"] { background: #f3f4f6; border-color: var(--missing); color: var(--missing); opacity:.5; }
  .tooth-num { font-size: .55rem; }
  .tooth-icon { font-size: .95rem; line-height:1; }

  /* 凡例 */
  .legend {
    display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px;
  }
  .legend-item {
    display: flex; align-items: center; gap: 4px;
    font-size: .75rem; color: var(--muted);
  }
  .legend-dot {
    width: 10px; height: 10px; border-radius: 2px;
  }

  /* ── フォーム ── */
  .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .form-group label { font-size: .8rem; font-weight: 700; color: var(--muted); }
  textarea, input[type="text"], input[type="date"] {
    font-family: inherit; font-size: .9rem; color: var(--text);
    border: 1.5px solid var(--border); border-radius: 8px;
    padding: 8px 12px; background: var(--surface);
    outline: none; transition: border-color .15s;
  }
  textarea { resize: vertical; min-height: 80px; }
  textarea:focus, input:focus { border-color: var(--accent); }

  /* チェックボックスリスト（次回予定）*/
  .checklist { display: flex; flex-direction: column; gap: 6px; }
  .check-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; border: 1.5px solid var(--border);
    border-radius: 8px; background: var(--surface); cursor: pointer;
    font-size: .88rem; transition: all .12s;
  }
  .check-item:hover { border-color: var(--accent); }
  .check-item.checked { background: #e8f5ee; border-color: var(--treated); color: var(--treated); font-weight: 700; }
  .check-item input[type="checkbox"] { display: none; }
  .check-mark { width: 18px; height: 18px; border-radius: 4px; border: 1.5px solid var(--border); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .check-item.checked .check-mark { background: var(--treated); border-color: var(--treated); color: #fff; }

  /* ── ポップアップ ── */
  .overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.45); z-index: 100;
    align-items: center; justify-content: center;
  }
  .overlay.open { display: flex; }
  .popup {
    background: var(--card); border-radius: 14px;
    padding: 24px; width: 360px; max-width: 95vw;
    box-shadow: 0 12px 40px rgba(0,0,0,.25);
  }
  .popup h3 { font-size: 1rem; margin-bottom: 16px; }
  .popup-footer { display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end; }

  /* 歯ステータス選択 */
  .tooth-status-grid { display: flex; flex-direction: column; gap: 8px; }
  .status-btn {
    padding: 10px 14px; border-radius: 8px; border: 1.5px solid var(--border);
    font-family: inherit; font-size: .9rem; font-weight: 700; cursor: pointer;
    text-align: left; background: var(--surface); display: flex; align-items: center; gap: 10px;
    transition: all .12s;
  }
  .status-btn:hover { border-color: var(--accent); }
  .status-btn.s-none    { }
  .status-btn.s-cavity  { color: var(--cavity);  background: #fde8e8; border-color: var(--cavity); }
  .status-btn.s-treated { color: var(--treated); background: #e8f5ee; border-color: var(--treated); }
  .status-btn.s-watch   { color: #a05a00;        background: #fef3e2; border-color: var(--watch); }
  .status-btn.s-crown   { color: var(--crown);   background: #e4f0f8; border-color: var(--crown); }
  .status-btn.s-missing { color: var(--missing); background: #f3f4f6; border-color: var(--missing); }

  /* QRポップアップ */
  #qrPopup .popup { width: 300px; text-align: center; }
  #qrcode { display: inline-block; margin: 16px auto; }
  #qrcode img { border: 1px solid var(--border); border-radius: 8px; }

  /* トースト */
  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #1a1714; color: #fff; padding: 10px 20px; border-radius: 100px;
    font-size: .85rem; opacity: 0; pointer-events: none;
    transition: opacity .3s; z-index: 999;
  }
  #toast.show { opacity: 1; }

  /* ローディング */
  .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 患者追加フォーム */
  #addPatientPopup .popup { width: 380px; }
</style>
</head>
<body>

<!-- ヘッダー -->
<header>
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M12 2C8 2 5 5 5 8c0 2.5 1 5 2 7l1 4h2l1-3 1 3h2l1-4c1-2 2-4.5 2-7 0-3-3-6-7-6z"/>
  </svg>
  <div>
    <h1>歯科電子治療ノート</h1>
    <small>医院管理画面</small>
  </div>
</header>

<div class="layout">
  <!-- サイドバー -->
  <aside class="sidebar">
    <div class="sidebar-head">
      <h2>患者一覧</h2>
      <div class="search-box">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="searchInput" placeholder="名前・カルテ番号で検索">
      </div>
      <button class="btn-add" onclick="openAddPatient()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        患者を追加
      </button>
    </div>
    <div class="patient-list" id="patientList">
      <div style="padding:20px;text-align:center;color:var(--muted);font-size:.85rem;">読み込み中…</div>
    </div>
  </aside>

  <!-- メイン -->
  <main class="main" id="mainArea">
    <div class="empty-state">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
        <path d="M12 2C8 2 5 5 5 8c0 2.5 1 5 2 7l1 4h2l1-3 1 3h2l1-4c1-2 2-4.5 2-7 0-3-3-6-7-6z"/>
      </svg>
      <p>患者を選択してください</p>
    </div>
  </main>
</div>

<!-- 歯ステータス選択ポップアップ -->
<div class="overlay" id="toothPopup">
  <div class="popup">
    <h3 id="toothPopupTitle">歯の状態を選択</h3>
    <div class="tooth-status-grid">
      <button class="status-btn s-none"    onclick="setToothStatus(null)">⬜ 正常（クリア）</button>
      <button class="status-btn s-cavity"  onclick="setToothStatus('cavity')">🔴 虫歯</button>
      <button class="status-btn s-treated" onclick="setToothStatus('treated')">✅ 治療済み</button>
      <button class="status-btn s-watch"   onclick="setToothStatus('watch')">⚠️ 要注意</button>
      <button class="status-btn s-crown"   onclick="setToothStatus('crown')">👑 被せ物・銀歯</button>
      <button class="status-btn s-missing" onclick="setToothStatus('missing')">✕ 欠損・抜歯</button>
    </div>
    <div class="popup-footer">
      <button class="btn" onclick="closePopup('toothPopup')">キャンセル</button>
    </div>
  </div>
</div>

<!-- 患者追加ポップアップ -->
<div class="overlay" id="addPatientPopup">
  <div class="popup" id="addPatientPopup">
    <h3>患者を追加</h3>
    <div class="form-group">
      <label>カルテ番号 *</label>
      <input type="text" id="newPatientId" placeholder="例: 1001">
    </div>
    <div class="form-group">
      <label>お名前 *</label>
      <input type="text" id="newPatientName" placeholder="例: 山田 太郎">
    </div>
    <div class="form-group">
      <label>生年月日</label>
      <input type="date" id="newPatientBD">
    </div>
    <div class="popup-footer">
      <button class="btn" onclick="closePopup('addPatientPopup')">キャンセル</button>
      <button class="btn primary" onclick="addPatient()">追加する</button>
    </div>
  </div>
</div>

<!-- QRポップアップ -->
<div class="overlay" id="qrPopup">
  <div class="popup">
    <h3 id="qrPatientName">QRコード</h3>
    <p style="font-size:.8rem;color:var(--muted);">このQRコードを患者さんに印刷して渡してください。</p>
    <div id="qrcode"></div>
    <p id="qrUrl" style="font-size:.65rem;color:var(--muted);word-break:break-all;"></p>
    <div class="popup-footer">
      <button class="btn" onclick="window.print()">印刷</button>
      <button class="btn primary" onclick="closePopup('qrPopup')">閉じる</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ============================================================
// ★ここにGASのウェブアプリURLを貼り付けてください★
// ============================================================
const GAS_URL = "https://script.google.com/macros/s/AKfycbzlKZDovPdU8Z9LGgEsHxgBbR6NSpg9vQtoI-VoZyjac181JSnA5WlAveK7AQFSdvEc/exec";
// ============================================================

// ★患者側HTMLのURL（QRコード生成に使います）★
// 例: "https://yourserver.com/patient.html"
// ローカルで試す場合はそのままでも可（QRにパスが入ります）
const PATIENT_URL = "https://katomasa1031-alt.github.io/dental-note/patient.html";

// ------------------------------------------------------------
// 状態
// ------------------------------------------------------------
let patients     = [];
let selectedPid  = null;
let currentRecord = {
  teethData:     {},
  treatmentNote: "",
  clinicMessage: "",
  nextPlan:      [],
  todayDone:     [],
  date:          today()
};
let selectedTooth = null;

const NEXT_OPTIONS = [
  "フッ素塗布", "定期検診", "虫歯治療の続き",
  "被せ物の型取り", "抜歯", "矯正チェック", "シーラント", "クリーニング"
];

const STATUS_ICON = { cavity:"🔴", treated:"✅", watch:"⚠️", crown:"👑", missing:"✕" };

// ------------------------------------------------------------
// 初期化
// ------------------------------------------------------------
document.addEventListener("DOMContentLoaded", () => {
  loadPatients();
  document.getElementById("searchInput").addEventListener("input", renderPatientList);
});

async function gasGet(params) {
  const url = GAS_URL + "?" + new URLSearchParams(params);
  const res  = await fetch(url);
  return res.json();
}
async function gasPost(body) {
  // GETに統一（CORSを避けるため）
  const url = GAS_URL + "?" + new URLSearchParams(
    Object.fromEntries(
      Object.entries(body).map(([k,v]) => [k, typeof v === 'object' ? JSON.stringify(v) : v])
    )
  );
  const res = await fetch(url);
  return res.json();
}

async function loadPatients() {
  try {
    const data = await gasGet({ action: "listPatients" });
    patients = data.patients || [];
  } catch(e) {
    // GAS未設定時はデモデータ
    patients = [
      { patientId:"1001", name:"山田 花子", birthdate:"2016-04-10", lastVisit:"2025-05-20" },
      { patientId:"1002", name:"田中 健太", birthdate:"2018-08-03", lastVisit:null }
    ];
  }
  renderPatientList();
}

function renderPatientList() {
  const q    = document.getElementById("searchInput").value.toLowerCase();
  const list = document.getElementById("patientList");
  const filt = patients.filter(p =>
    p.name.includes(q) || p.patientId.toString().includes(q)
  );
  if (!filt.length) { list.innerHTML = `<div style="padding:20px;text-align:center;color:var(--muted);font-size:.85rem;">患者が見つかりません</div>`; return; }
  list.innerHTML = filt.map(p => `
    <div class="patient-item ${p.patientId === selectedPid ? 'active' : ''}" onclick="selectPatient('${p.patientId}')">
      <span class="pid">カルテ #${p.patientId}</span>
      <span class="pname">${p.name}</span>
      <span class="plast">${p.lastVisit ? `最終来院: ${p.lastVisit}` : "来院記録なし"}</span>
    </div>
  `).join("");
}

// ------------------------------------------------------------
// 患者選択
// ------------------------------------------------------------
async function selectPatient(pid) {
  selectedPid = pid;
  renderPatientList();

  document.getElementById("mainArea").innerHTML = `<div class="empty-state"><div class="spinner" style="border-color:var(--border);border-top-color:var(--accent);width:32px;height:32px;"></div><p>読み込み中…</p></div>`;

  let data = {};
  try { data = await gasGet({ action:"getPatient", patientId: pid }); } catch(e) {}

  const p   = data.patient   || patients.find(x => x.patientId === pid) || {};
  const rec = data.latestRecord;

  currentRecord = rec ? {
    teethData:     rec.teethData     || {},
    treatmentNote: rec.treatmentNote || "",
    clinicMessage: rec.clinicMessage || "",
    nextPlan:      rec.nextPlan      || [],
    todayDone:     rec.todayDone     || [],
    date:          rec.date          || today()
  } : { teethData:{}, treatmentNote:"", clinicMessage:"", nextPlan:[], todayDone:[], date:today() };

  renderMain(p);
}

function renderMain(p) {
  const initial = (p.name || "?")[0];
  document.getElementById("mainArea").innerHTML = `
    <!-- 患者ヘッダー -->
    <div class="patient-header">
      <div class="avatar">${initial}</div>
      <div class="info">
        <h2>${p.name || "不明"}</h2>
        <p>カルテ #${p.patientId} ${p.birthdate ? `・生年月日: ${p.birthdate}` : ""}</p>
      </div>
      <div class="actions">
        <button class="btn" onclick="showQR('${p.patientId}', '${p.name}')">📱 QR表示</button>
        <button class="btn primary" onclick="saveRecord()">💾 保存する</button>
      </div>
    </div>

    <!-- 歯式 -->
    <div class="card">
      <div class="card-title">🦷 歯式（クリックで状態を変更）</div>
      <div class="teeth-grid" id="teethGrid"></div>
      <div class="legend">
        <div class="legend-item"><div class="legend-dot" style="background:#fde8e8;border:1px solid var(--cavity)"></div>虫歯</div>
        <div class="legend-item"><div class="legend-dot" style="background:#e8f5ee;border:1px solid var(--treated)"></div>治療済み</div>
        <div class="legend-item"><div class="legend-dot" style="background:#fef3e2;border:1px solid var(--watch)"></div>要注意</div>
        <div class="legend-item"><div class="legend-dot" style="background:#e4f0f8;border:1px solid var(--crown)"></div>被せ物</div>
        <div class="legend-item"><div class="legend-dot" style="background:#f3f4f6;border:1px solid var(--missing)"></div>欠損</div>
      </div>
    </div>

    <!-- 今日の治療 -->
    <div class="card">
      <div class="card-title">📋 今日治療したこと</div>
      <div class="form-group">
        <label>治療日</label>
        <input type="date" id="recDate" value="${currentRecord.date}">
      </div>
      <div class="form-group">
        <label>きょうおこなったのは</label>
        <div class="checklist" id="todayDoneList"></div>
      </div>
      <div class="form-group">
        <label>治療内容（詳細メモ）</label>
        <textarea id="treatmentNote" placeholder="例: 右下6番の虫歯を削って詰め物をしました。">${currentRecord.treatmentNote}</textarea>
      </div>
    </div>

    <!-- 医院からのメッセージ -->
    <div class="card">
      <div class="card-title">💬 医院からのメッセージ</div>
      <div class="form-group">
        <textarea id="clinicMessage" placeholder="例: 歯みがきをがんばっています！次回もお待ちしています🦷">${currentRecord.clinicMessage}</textarea>
      </div>
    </div>

    <!-- 次回の治療予定 -->
    <div class="card">
      <div class="card-title">📅 次回の治療予定</div>
      <div class="checklist" id="nextPlanList"></div>
    </div>
  `;

  renderTeeth();
  renderNextPlan();
  renderTodayDoneList();
}

// ------------------------------------------------------------
// 歯式レンダリング
// ------------------------------------------------------------
// FDI方式: 上右11-18, 上左21-28, 下左31-38, 下右41-48
// 乳歯: 51-55, 61-65, 71-75, 81-85
function renderTeeth() {
  const g = document.getElementById("teethGrid");
  if (!g) return;

  const upper_R = [18,17,16,15,14,13,12,11];
  const upper_L = [21,22,23,24,25,26,27,28];
  const lower_L = [31,32,33,34,35,36,37,38];
  const lower_R = [48,47,46,45,44,43,42,41];

  // 乳歯
  const dec_UR = [55,54,53,52,51];
  const dec_UL = [61,62,63,64,65];
  const dec_LL = [71,72,73,74,75];
  const dec_LR = [85,84,83,82,81];

  function toothHTML(num, dec=false) {
    const s   = currentRecord.teethData[num] || "";
    const ico = STATUS_ICON[s] || "";
    return `<div class="tooth${dec?' deciduous':''}" data-num="${num}" data-status="${s}" onclick="openToothPopup(${num})" title="歯番 ${num}">
      <span class="tooth-icon">${ico}</span>
      <span class="tooth-num">${num}</span>
    </div>`;
  }

  g.innerHTML = `
    <div class="teeth-row">
      <span class="teeth-label">UR</span>
      ${upper_R.map(n=>toothHTML(n)).join("")}
      <span class="teeth-label" style="width:8px"></span>
      ${upper_L.map(n=>toothHTML(n)).join("")}
      <span class="teeth-label">UL</span>
    </div>
    <div class="teeth-row" style="opacity:.75;margin-top:-2px;">
      <span class="teeth-label" style="font-size:.55rem">乳</span>
      ${dec_UR.map(n=>toothHTML(n,true)).join("")}
      <span style="width:68px"></span>
      ${dec_UL.map(n=>toothHTML(n,true)).join("")}
      <span class="teeth-label" style="font-size:.55rem">乳</span>
    </div>
    <div class="jaw-divider" style="width:calc(100% - 44px)"></div>
    <div class="teeth-row" style="opacity:.75;">
      <span class="teeth-label" style="font-size:.55rem">乳</span>
      ${dec_LR.map(n=>toothHTML(n,true)).join("")}
      <span style="width:68px"></span>
      ${dec_LL.map(n=>toothHTML(n,true)).join("")}
      <span class="teeth-label" style="font-size:.55rem">乳</span>
    </div>
    <div class="teeth-row">
      <span class="teeth-label">LR</span>
      ${lower_R.map(n=>toothHTML(n)).join("")}
      <span class="teeth-label" style="width:8px"></span>
      ${lower_L.map(n=>toothHTML(n)).join("")}
      <span class="teeth-label">LL</span>
    </div>
  `;
}

function openToothPopup(num) {
  selectedTooth = num;
  document.getElementById("toothPopupTitle").textContent = `歯番 ${num} の状態を選択`;
  document.getElementById("toothPopup").classList.add("open");
}

function setToothStatus(status) {
  if (status === null) delete currentRecord.teethData[selectedTooth];
  else currentRecord.teethData[selectedTooth] = status;
  closePopup("toothPopup");
  renderTeeth();
}

// ------------------------------------------------------------
// 次回予定チェックリスト
// ------------------------------------------------------------
function renderNextPlanList() {
  const el = document.getElementById("nextPlanList");
  if (!el) return;
  el.innerHTML = NEXT_OPTIONS.map(opt => {
    const checked = currentRecord.nextPlan.includes(opt);
    return `<label class="check-item ${checked ? 'checked' : ''}">
      <input type="checkbox" ${checked ? 'checked' : ''} onchange="togglePlan('${opt}', this.checked)">
      <div class="check-mark">${checked ? '✓' : ''}</div>
      ${opt}
    </label>`;
  }).join("");
}
function renderNextPlan() { renderNextPlanList(); }

const TODAY_OPTIONS_CLINIC = ["歯のクリーニングです","むし歯の治療です","むし歯の予防（フッ素・シーラント）です"];

function renderTodayDoneList() {
  const el = document.getElementById("todayDoneList");
  if (!el) return;
  el.innerHTML = TODAY_OPTIONS_CLINIC.map(opt => {
    const checked = currentRecord.todayDone.includes(opt);
    return `<label class="check-item ${checked ? 'checked' : ''}">
      <input type="checkbox" ${checked ? 'checked' : ''} onchange="toggleToday('${opt}', this.checked)">
      <div class="check-mark">${checked ? '✓' : ''}</div>
      ${opt}
    </label>`;
  }).join("");
}

function toggleToday(opt, val) {
  if (val) { if (!currentRecord.todayDone.includes(opt)) currentRecord.todayDone.push(opt); }
  else { currentRecord.todayDone = currentRecord.todayDone.filter(x => x !== opt); }
  renderTodayDoneList();
}

function togglePlan(opt, val) {
  if (val) { if (!currentRecord.nextPlan.includes(opt)) currentRecord.nextPlan.push(opt); }
  else { currentRecord.nextPlan = currentRecord.nextPlan.filter(x => x !== opt); }
  renderNextPlanList();
}

// ------------------------------------------------------------
// 保存
// ------------------------------------------------------------
async function saveRecord() {
  if (!selectedPid) return;
  currentRecord.treatmentNote = document.getElementById("treatmentNote")?.value || "";
  currentRecord.clinicMessage = document.getElementById("clinicMessage")?.value || "";
  currentRecord.date          = document.getElementById("recDate")?.value || today();

  try {
    const res = await gasPost({
      action:        "saveRecord",
      patientId:     selectedPid,
      date:          currentRecord.date,
      teethData:     currentRecord.teethData,
      treatmentNote: currentRecord.treatmentNote,
      clinicMessage: currentRecord.clinicMessage,
      nextPlan:      currentRecord.nextPlan,
      todayDone:     currentRecord.todayDone
    });
    if (res.error) throw new Error(res.error);
    toast("✅ 保存しました");
    loadPatients();
  } catch(e) {
    toast("⚠️ 保存エラー: " + e.message);
  }
}

// ------------------------------------------------------------
// 患者追加
// ------------------------------------------------------------
function openAddPatient() {
  document.getElementById("newPatientId").value = "";
  document.getElementById("newPatientName").value = "";
  document.getElementById("newPatientBD").value = "";
  document.getElementById("addPatientPopup").classList.add("open");
}
async function addPatient() {
  const pid  = document.getElementById("newPatientId").value.trim();
  const name = document.getElementById("newPatientName").value.trim();
  const bd   = document.getElementById("newPatientBD").value;
  if (!pid || !name) { toast("カルテ番号とお名前は必須です"); return; }
  try {
    const res = await gasPost({ action:"addPatient", patientId:pid, name, birthdate:bd });
    if (res.error) throw new Error(res.error);
    toast("患者を追加しました");
    closePopup("addPatientPopup");
    await loadPatients();
    selectPatient(pid);
  } catch(e) {
    toast("エラー: " + e.message);
  }
}

// ------------------------------------------------------------
// QRコード
// ------------------------------------------------------------
function showQR(pid, name) {
  const url = `${PATIENT_URL}?patient=${encodeURIComponent(pid)}`;
  document.getElementById("qrPatientName").textContent = `QRコード：${name} さん`;
  document.getElementById("qrUrl").textContent = url;
  document.getElementById("qrcode").innerHTML = "";
  new QRCode(document.getElementById("qrcode"), { text: url, width: 200, height: 200, colorDark:"#1a1714", colorLight:"#ffffff" });
  document.getElementById("qrPopup").classList.add("open");
}

// ------------------------------------------------------------
// ユーティリティ
// ------------------------------------------------------------
function closePopup(id) { document.getElementById(id).classList.remove("open"); }
function today() { return new Date().toISOString().slice(0,10); }
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 2800);
}
</script>
</body>
</html>
