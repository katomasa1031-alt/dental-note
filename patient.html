<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>わたしの歯みがきノート</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--or:#f4a35a;--orl:#fff3e0;--orb:#f4d5b0;--gr:#2d9c63;--tx:#3e2a1e;--mu:#a07050;--bg:#fff9f2;--wh:#ffffff;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;padding-bottom:40px;}
.hero{background:linear-gradient(135deg,#f4a35a,#ffb300);padding:22px 20px 44px;text-align:center;}
.hero h1{font-size:1.5rem;font-weight:900;color:#fff;margin-bottom:3px;}
.hero .sub{font-size:.85rem;color:rgba(255,255,255,.85);}
.con{max-width:520px;margin:-22px auto 0;padding:0 14px;display:flex;flex-direction:column;gap:14px;}
.card{background:var(--wh);border-radius:16px;border:2px solid var(--orb);overflow:hidden;}
.ch{padding:10px 16px;background:var(--orl);border-bottom:2px solid var(--orb);font-size:.78rem;font-weight:800;color:var(--mu);}
.cb{padding:14px 16px;}
.pb{display:flex;align-items:center;gap:14px;}
.av{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#f4a35a,#ffb300);color:#fff;font-size:1.5rem;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.pi h2{font-size:1.15rem;font-weight:900;}
.pi p{font-size:.78rem;color:var(--mu);margin-top:2px;}
.vc{margin-left:auto;background:var(--orl);border:2px solid var(--orb);border-radius:10px;padding:6px 10px;text-align:center;flex-shrink:0;}
.vc .vd{font-size:1.05rem;font-weight:900;color:var(--or);}
.vc .vm{font-size:.62rem;color:var(--mu);}
.tw{width:100%;max-width:360px;margin:0 auto;}
.lr{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px;}
.li{display:flex;align-items:center;gap:4px;font-size:.72rem;color:var(--mu);}
.ld{width:11px;height:11px;border-radius:50%;flex-shrink:0;}
.cl{display:flex;flex-direction:column;gap:6px;}
.ci{display:flex;align-items:center;gap:8px;padding:9px 12px;border:1.5px solid var(--orb);border-radius:10px;background:var(--orl);font-size:.88rem;}
.ci.on{background:#e8f5ee;border-color:#2d9c63;font-weight:700;}
.cb2{width:17px;height:17px;border-radius:4px;border:2px solid var(--or);background:#fff;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;}
.cb2.on{background:#2d9c63;border-color:#2d9c63;color:#fff;}
.mb{background:linear-gradient(135deg,#e8f5ee,#f0faf5);border:2px solid #a5d6b0;border-radius:0 14px 14px 14px;padding:13px 15px;font-size:.92rem;line-height:1.7;color:#1a4a2e;position:relative;}
.mb::before{content:"";position:absolute;top:-10px;left:14px;border:5px solid transparent;border-bottom-color:#a5d6b0;}
.ct{font-size:.72rem;color:var(--gr);font-weight:800;margin-bottom:7px;}
.ng{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.ni{display:flex;align-items:flex-start;gap:7px;padding:8px 10px;border:1.5px solid var(--orb);border-radius:10px;background:var(--orl);font-size:.82rem;line-height:1.4;}
.ni.on{background:#e8f5ee;border-color:#2d9c63;}
.nc{width:18px;height:18px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:900;}
.nc.on{background:var(--gr);color:#fff;}
.nc.off{background:#fff;border:2px solid var(--orb);}
.stamp{text-align:center;padding:18px;color:var(--mu);font-size:.82rem;}
.stamp .big{font-size:2.2rem;display:block;margin-bottom:4px;}
.eb{background:#fde8e8;border:2px solid #e05050;border-radius:12px;padding:18px;text-align:center;color:#a02020;font-size:.88rem;line-height:1.7;}
.dsel-wrap{margin-top:12px;padding:10px 14px;background:var(--orl);border-top:2px solid var(--orb);display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.dsel-wrap label{font-size:.75rem;font-weight:800;color:var(--mu);white-space:nowrap;}
.dsel{font-family:'Nunito',sans-serif;font-size:.82rem;color:var(--tx);border:2px solid var(--orb);border-radius:8px;padding:5px 8px;background:#fff;outline:none;cursor:pointer;flex:1;min-width:0;}
.dsel:focus{border-color:var(--or);}
.dbadge{font-size:.72rem;font-weight:800;padding:3px 9px;border-radius:100px;white-space:nowrap;}
.dbadge.today{background:#e8f5ee;color:#1a5c36;border:1.5px solid #9dd4b4;}
.dbadge.past{background:#fff3e0;color:#7a4800;border:1.5px solid var(--orb);}
</style>
</head>
<body>
<div class="hero">
  <h1>&#x1F9B7; わたしの歯みがきノート</h1>
  <p class="sub" id="hs">&#x3000;</p>
</div>
<div class="con" id="app"></div>
<script>
var GAS_URL = "https://script.google.com/macros/s/AKfycbz2qrHdZBz8g4mkO55CuDZWZLmbCC4dDxM_lTfZZPzVnjOb97OtAaEQAiuj3waFtKRK/exec";
var TP = {"11":{cx:46.6,cy:11.6,r:1.9},"12":{cx:41.3,cy:12.4,r:1.9},"13":{cx:36.1,cy:14.0,r:2.1},"14":{cx:31.2,cy:16.3,r:2.3},"15":{cx:26.7,cy:19.2,r:2.5},"16":{cx:22.6,cy:22.8,r:3.0},"17":{cx:18.6,cy:27.4,r:3.0},"18":{cx:15.2,cy:33.1,r:3.2},"21":{cx:53.4,cy:11.6,r:1.9},"22":{cx:58.7,cy:12.4,r:1.9},"23":{cx:63.9,cy:14.0,r:2.1},"24":{cx:68.8,cy:16.3,r:2.3},"25":{cx:73.3,cy:19.2,r:2.5},"26":{cx:77.4,cy:22.8,r:3.0},"27":{cx:81.3,cy:27.4,r:3.0},"28":{cx:84.8,cy:33.1,r:3.2},"31":{cx:53.4,cy:88.4,r:1.9},"32":{cx:58.7,cy:87.6,r:1.9},"33":{cx:63.9,cy:86.0,r:2.1},"34":{cx:68.8,cy:83.7,r:2.3},"35":{cx:73.3,cy:80.8,r:2.5},"36":{cx:77.4,cy:77.3,r:3.0},"37":{cx:81.3,cy:72.6,r:3.0},"38":{cx:84.8,cy:66.9,r:3.2},"41":{cx:46.6,cy:88.4,r:1.9},"42":{cx:41.3,cy:87.6,r:1.9},"43":{cx:36.1,cy:86.0,r:2.1},"44":{cx:31.2,cy:83.7,r:2.3},"45":{cx:26.7,cy:80.8,r:2.5},"46":{cx:22.6,cy:77.3,r:3.0},"47":{cx:18.6,cy:72.6,r:3.0},"48":{cx:15.2,cy:66.9,r:3.2},"51":{cx:46.5,cy:25.6,r:1.7},"52":{cx:42.3,cy:26.6,r:1.7},"53":{cx:38.3,cy:28.3,r:1.9},"54":{cx:34.6,cy:30.6,r:2.1},"55":{cx:31.4,cy:33.5,r:2.3},"61":{cx:53.5,cy:25.6,r:1.7},"62":{cx:57.7,cy:26.6,r:1.7},"63":{cx:61.7,cy:28.3,r:1.9},"64":{cx:65.4,cy:30.6,r:2.1},"65":{cx:68.6,cy:33.5,r:2.3},"71":{cx:53.5,cy:74.4,r:1.7},"72":{cx:57.7,cy:73.4,r:1.7},"73":{cx:61.7,cy:71.7,r:1.9},"74":{cx:65.4,cy:69.4,r:2.1},"75":{cx:68.6,cy:66.5,r:2.3},"81":{cx:46.5,cy:74.4,r:1.7},"82":{cx:42.3,cy:73.4,r:1.7},"83":{cx:38.3,cy:71.7,r:1.9},"84":{cx:34.6,cy:69.4,r:2.1},"85":{cx:31.4,cy:66.5,r:2.3}};
var TL = {"11":"1","12":"2","13":"3","14":"4","15":"5","16":"6","17":"7","18":"8","21":"1","22":"2","23":"3","24":"4","25":"5","26":"6","27":"7","28":"8","31":"1","32":"2","33":"3","34":"4","35":"5","36":"6","37":"7","38":"8","41":"1","42":"2","43":"3","44":"4","45":"5","46":"6","47":"7","48":"8","51":"A","52":"B","53":"C","54":"D","55":"E","61":"A","62":"B","63":"C","64":"D","65":"E","71":"A","72":"B","73":"C","74":"D","75":"E","81":"A","82":"B","83":"C","84":"D","85":"E"};
var SC = {cavity:{bg:"rgba(224,80,80,.8)",bd:"#c03030",lb:"むし歯",dt:"#e05050"},treated:{bg:"rgba(45,156,99,.8)",bd:"#1a7a50",lb:"ちりょう済",dt:"#2d9c63"},watch:{bg:"rgba(245,124,0,.8)",bd:"#c06000",lb:"ようちゅうい",dt:"#f57c00"},crown:{bg:"rgba(41,121,184,.8)",bd:"#1a5a9a",lb:"かぶせ物",dt:"#2979b8"}};
var TO = ["歯のクリーニングです","むし歯の治療です","むし歯の予防（フッ素・シーラント）です"];
var NO = ["歯のクリーニング","むし歯の治療","むし歯の予防","歯みがきチェック","フッ素塗布","クリーニング","矯正チェック","シーラント"];

var currentPatient = null;
var visitDates = [];

function today() {
  var d = new Date();
  d.setTime(d.getTime() + 9*60*60*1000);
  return d.toISOString().slice(0,10);
}

function formatDateJa(s) {
  var p = String(s).split("T")[0].split("-");
  if (p.length !== 3) return s;
  return p[0] + "年" + Number(p[1]) + "月" + Number(p[2]) + "日";
}

function init() {
  var pid = new URLSearchParams(location.search).get("patient");
  if (!pid) { err("URLにカルテ番号が含まれていません"); return; }
  document.getElementById("hs").textContent = "カルテ番号: " + pid;

  fetch(GAS_URL + "?action=getPatient&patientId=" + encodeURIComponent(pid))
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (!d || !d.patient) { err("データを読み込めませんでした"); return; }
      currentPatient = d.patient;
      document.getElementById("hs").textContent = d.patient.name + " さん専用ノート";
      render(d.patient, d.latestRecord);
      return fetch(GAS_URL + "?action=getRecordDates&patientId=" + encodeURIComponent(pid));
    })
    .then(function(r){ return r ? r.json() : null; })
    .then(function(d){
      if (!d || !d.dates) return;
      visitDates = d.dates;
      renderDateSelector(visitDates);
    })
    .catch(function(){ err("データを読み込めませんでした"); });
}

function renderDateSelector(dates) {
  var wrap = document.getElementById("dsel-wrap");
  if (!wrap || !dates.length) return;
  var todayStr = today();
  var options = dates.map(function(d){
    var isToday = d === todayStr;
    var label = isToday ? formatDateJa(d) + "（本日）" : formatDateJa(d);
    return '<option value="' + d + '">' + label + '</option>';
  }).join("");
  var firstDate = dates[0];
  var isFirstToday = firstDate === todayStr;
  var badge = isFirstToday
    ? '<span class="dbadge today">⭐ 本日</span>'
    : '<span class="dbadge past">📋 ' + formatDateJa(firstDate) + '</span>';
  wrap.innerHTML =
    '<label>📅 来院日：</label>' +
    '<select class="dsel" id="dateSelect" onchange="changeDate(this.value)">' + options + '</select>' +
    '<span id="dbadge-wrap">' + badge + '</span>';
}

function changeDate(date) {
  if (!currentPatient) return;
  var pid = currentPatient.patientId;
  var bwrap = document.getElementById("dbadge-wrap");
  var isToday = date === today();
  if (bwrap) {
    bwrap.innerHTML = isToday
      ? '<span class="dbadge today">⭐ 本日</span>'
      : '<span class="dbadge past">📋 ' + formatDateJa(date) + '</span>';
  }
  fetch(GAS_URL + "?action=getRecordByDate&patientId=" + encodeURIComponent(pid) + "&date=" + encodeURIComponent(date))
    .then(function(r){ return r.json(); })
    .then(function(d){
      renderRecord(d && d.record ? d.record : null);
    })
    .catch(function(){ renderRecord(null); });
}

function fd(s) {
  if (!s) return {y:"",m:"",d:""};
  var p = String(s).split("T")[0].split("-");
  if (p.length===3) return {y:p[0],m:String(Number(p[1])),d:String(Number(p[2]))};
  return {y:"",m:"",d:""};
}

function br(s) {
  if (!s) return "";
  var r = "";
  for (var i=0;i<s.length;i++) {
    if (s[i]==="\n") r += "<br>";
    else r += s[i];
  }
  return r;
}

function render(p, rec) {
  var dt = rec ? fd(rec.date) : {};
  var h = "";
  h += '<div class="card"><div class="ch">&#x1F464; 患者さん情報</div><div class="cb"><div class="pb">';
  h += '<div class="av">' + (p.name||"?")[0] + "</div>";
  h += '<div class="pi"><h2>' + p.name + "</h2><p>カルテ #" + p.patientId + "</p></div>";
  if (dt.y) h += '<div class="vc"><div class="vm">' + dt.m + '月</div><div class="vd">' + dt.d + '日</div><div class="vm">' + dt.y + "</div></div>";
  h += "</div>";
  h += '<div class="dsel-wrap" id="dsel-wrap"></div>';
  h += "</div></div>";
  h += '<div id="record-area"></div>';
  document.getElementById("app").innerHTML = h;
  renderRecord(rec);
}

function renderRecord(rec) {
  var area = document.getElementById("record-area");
  if (!area) return;
  var h = "";
  h += '<div class="card"><div class="ch">&#x1F9B7; はのようす</div><div class="cb">';
  h += '<div class="tw"><svg id="teethSVG" viewBox="0 0 400 480" width="100%" style="max-width:360px;display:block;margin:0 auto;"></svg></div>';
  h += '<div class="lr" id="lr"></div></div></div>';
  if (rec) {
    h += '<div class="card"><div class="ch">&#x1F4CB; きょうおこなったのは</div><div class="cb"><div class="cl" id="tl"></div></div></div>';
    if (rec.clinicMessage) {
      h += '<div class="card"><div class="ch">&#x1F4AC; 先生からのメッセージ</div><div class="cb"><div class="ct">&#x1F3E5; 歯医者さんより</div><div class="mb">' + br(rec.clinicMessage) + "</div></div></div>";
    }
    if (rec.nextPlan && rec.nextPlan.length) {
      h += '<div class="card"><div class="ch">&#x1F4C5; つぎのちりょう予定</div><div class="cb"><div class="ng" id="nl"></div></div></div>';
    }
    h += '<div class="stamp"><span class="big">&#x2B50;</span>きょうもよくがんばりました！</div>';
  } else {
    h += '<div class="eb">この日の記録はありません</div>';
  }
  area.innerHTML = h;
  rTeeth(rec ? (rec.teethData||{}) : {});
  if (rec) {
    rToday(rec.todayDone||[], rec.treatmentNote);
    if (rec.nextPlan && rec.nextPlan.length) rNext(rec.nextPlan);
  }
}

function rTeeth(td) {
  var svg = document.getElementById("teethSVG");
  var lg  = document.getElementById("lr");
  if (!svg) return;

  var W = 400, H = 480;
  var ns = "http://www.w3.org/2000/svg";

  function el(tag, attrs) {
    var e = document.createElementNS(ns, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  svg.innerHTML = "";

  // 中心線
  svg.appendChild(el("line", {x1:W/2,y1:12,x2:W/2,y2:H-12,stroke:"#e0d0c0","stroke-width":"0.8","stroke-dasharray":"3,2"}));
  svg.appendChild(el("line", {x1:12,y1:H/2,x2:W-12,y2:H/2,stroke:"#e0d0c0","stroke-width":"0.8","stroke-dasharray":"3,2"}));

  // 上下左右ラベル
  function addTxt(x, y, t, size, color) {
    var tx = el("text", {x:x, y:y, "text-anchor":"middle", "dominant-baseline":"middle", "font-size":size||11, fill:color||"#2d9c63", "font-family":"Nunito,sans-serif", "font-weight":"700"});
    tx.textContent = t; svg.appendChild(tx);
  }
  addTxt(W/2, 7,   "上");
  addTxt(W/2, H-7, "下");
  addTxt(8,   H/2, "右");
  addTxt(W-8, H/2, "左");

  var used = [];

  for (var num in TP) {
    var pos = TP[num];
    var x = pos.cx/100 * W;
    var y = pos.cy/100 * H;
    var r = pos.r/100  * W;
    var isDec = Number(num) >= 51;
    var status = td[num];
    var sc = status ? SC[status] : null;

    // 歯の輪（状態なし: ベースカラー、状態あり: 状態色）
    var strokeColor = isDec ? "#aad4f0" : "#f4a35a";
    var fillColor   = sc ? sc.bg : "rgba(255,255,255,0.6)";
    var ringStroke  = sc ? sc.bd : strokeColor;

    svg.appendChild(el("circle", {
      cx:x, cy:y, r:r,
      fill: fillColor,
      stroke: ringStroke,
      "stroke-width": sc ? "2" : "1.5"
    }));

    // 歯番ラベル
    var lbl = TL[num] || num;
    var txtColor = sc ? "#fff" : (isDec ? "#5a8faa" : "#c07830");
    addTxt(x, y, lbl, r * 1.05, txtColor);

    if (sc && used.indexOf(status) < 0) used.push(status);
  }

  // 凡例
  var lh = "";
  for (var i = 0; i < used.length; i++) {
    lh += '<div class="li"><div class="ld" style="background:' + SC[used[i]].dt + '"></div>' + SC[used[i]].lb + '</div>';
  }
  lg.innerHTML = lh;
}

function rToday(done, note) {
  var el = document.getElementById("tl"); if (!el) return;
  var h = "";
  for (var i=0;i<TO.length;i++) {
    var on = done.indexOf(TO[i])>=0;
    if (!on) continue;
    h += '<div class="ci on"><div class="cb2 on">&#x2713;</div>' + TO[i] + "</div>";
  }
  if (note) h += '<div style="margin-top:8px;padding:13px 15px;background:linear-gradient(135deg,#e8f5ee,#f0faf5);border:2px solid #a5d6b0;border-radius:0 14px 14px 14px;font-size:.92rem;line-height:1.7;color:#1a4a2e;">' + br(note) + "</div>";
  el.innerHTML = h;
}

function rNext(plan) {
  var el = document.getElementById("nl"); if (!el) return;
  var h = "";
  for (var i=0;i<NO.length;i++) {
    var on = plan.indexOf(NO[i])>=0;
    h += '<div class="ni'+(on?" on":"")+'"><div class="nc '+(on?"on":"off")+'">' + (on?"&#x2713;":"") + '</div>'+NO[i]+'</div>';
  }
  el.innerHTML = h;
}

function err(msg) {
  document.getElementById("hs").textContent = "エラー";
  document.getElementById("app").innerHTML = '<div class="eb">'+msg+'</div>';
}

init();
</script>
</body>
</html>
