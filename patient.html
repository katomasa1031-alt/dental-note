<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>わたしの歯みがきノート</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--orange:#f4a35a;--orange-light:#fff3e0;--orange-border:#f4d5b0;--green:#2d9c63;--text:#3e2a1e;--muted:#a07050;--bg:#fff9f2;--white:#ffffff;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:40px;}
  .hero{background:linear-gradient(135deg,#f4a35a 0%,#ffb300 100%);padding:22px 20px 44px;text-align:center;position:relative;overflow:hidden;}
  .hero::before{content:"🦷";position:absolute;font-size:100px;opacity:.08;top:-10px;right:-10px;transform:rotate(15deg);}
  .hero h1{font-size:1.5rem;font-weight:900;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.15);margin-bottom:3px;}
  .hero .sub{font-size:.85rem;color:rgba(255,255,255,.85);}
  .container{max-width:520px;margin:-22px auto 0;padding:0 14px;display:flex;flex-direction:column;gap:14px;}
  .card{background:var(--white);border-radius:16px;border:2px solid var(--orange-border);box-shadow:0 4px 18px rgba(244,163,90,.1);overflow:hidden;}
  .card-head{padding:10px 16px;background:var(--orange-light);border-bottom:2px solid var(--orange-border);font-size:.78rem;font-weight:800;color:var(--muted);letter-spacing:.06em;display:flex;align-items:center;gap:6px;}
  .card-body{padding:14px 16px;}
  .pat-badge{display:flex;align-items:center;gap:14px;}
  .pat-avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#f4a35a,#ffb300);color:#fff;font-size:1.5rem;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .pat-info h2{font-size:1.15rem;font-weight:900;}
  .pat-info p{font-size:.78rem;color:var(--muted);font-family:'DM Mono',monospace;margin-top:2px;}
  .visit-chip{margin-left:auto;background:var(--orange-light);border:2px solid var(--orange-border);border-radius:10px;padding:6px 10px;text-align:center;flex-shrink:0;}
  .visit-chip .vd{font-size:1.05rem;font-weight:900;color:var(--orange);}
  .visit-chip .vm{font-size:.62rem;color:var(--muted);}
  .teeth-wrap{position:relative;width:100%;max-width:320px;margin:0 auto;display:block;}
  .teeth-img{width:100%;height:auto;display:block;}
  .teeth-overlay{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;}
  .tooth-marker{position:absolute;transform:translate(-50%,-50%);border-radius:50%;border:2px solid transparent;}
  .tooth-marker[data-s="cavity"]  {background:rgba(224,80,80,.8);border-color:#c03030;}
  .tooth-marker[data-s="treated"] {background:rgba(45,156,99,.8);border-color:#1a7a50;}
  .tooth-marker[data-s="watch"]   {background:rgba(245,124,0,.8);border-color:#c06000;}
  .tooth-marker[data-s="crown"]   {background:rgba(41,121,184,.8);border-color:#1a5a9a;}
  .tooth-marker[data-s="missing"] {background:rgba(120,120,120,.7);border-color:#888;}
  .legend-row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px;}
  .leg{display:flex;align-items:center;gap:4px;font-size:.72rem;color:var(--muted);}
  .leg-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;}
  .chk-list{display:flex;flex-direction:column;gap:6px;}
  .chk-item{display:flex;align-items:center;gap:8px;padding:9px 12px;border:1.5px solid var(--orange-border);border-radius:10px;background:var(--orange-light);font-size:.88rem;}
  .chk-item.on{background:#e8f5ee;border-color:#2d9c63;}
  .chk-box{width:17px;height:17px;border-radius:4px;border:2px solid var(--orange);background:#fff;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .chk-box.on{background:#2d9c63;border-color:#2d9c63;color:#fff;font-size:11px;font-weight:900;}
  .msg-bubble{background:linear-gradient(135deg,#e8f5ee,#f0faf5);border:2px solid #a5d6b0;border-radius:0 14px 14px 14px;padding:13px 15px;font-size:.92rem;line-height:1.7;color:#1a4a2e;position:relative;}
  .msg-bubble::before{content:"";position:absolute;top:-10px;left:14px;border:5px solid transparent;border-bottom-color:#a5d6b0;}
  .clinic-tag{font-size:.72rem;color:var(--green);font-weight:800;margin-bottom:7px;}
  .next-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  .next-item{display:flex;align-items:flex-start;gap:7px;padding:8px 10px;border:1.5px solid var(--orange-border);border-radius:10px;background:var(--orange-light);font-size:.82rem;line-height:1.4;}
  .next-item.on{background:#e8f5ee;border-color:#2d9c63;}
  .next-check{width:18px;height:18px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:900;}
  .next-check.on{background:var(--green);color:#fff;}
  .next-check.off{background:#fff;border:2px solid var(--orange-border);}
  .stamp{text-align:center;padding:18px;color:var(--muted);font-size:.82rem;}
  .stamp .big{font-size:2.2rem;display:block;margin-bottom:4px;}
  .warn-box{background:#fff8e1;border:2px solid #ffcc02;border-radius:12px;padding:14px 16px;font-size:.82rem;color:#5a4000;line-height:1.7;text-align:center;}
  .err-box{background:#fde8e8;border:2px solid #e05050;border-radius:12px;padding:18px;text-align:center;color:#a02020;font-size:.88rem;line-height:1.7;}
</style>
</head>

  <h1>🦷 わたしの歯みがきノート</h1>

</div>

  "74":{cx:69.5,cy:61.0,r:2.2},"75":{cx:68.5,cy:55.5,r:2.2}
};
const STATUS_COLOR = {
  cavity:  {bg:"rgba(224,80,80,.8)",  border:"#c03030",label:"むし歯",    dot:"#e05050"},
  treated: {bg:"rgba(45,156,99,.8)",  border:"#1a7a50",label:"ちりょう済", dot:"#2d9c63"},
  watch:   {bg:"rgba(245,124,0,.8)",  border:"#c06000",label:"ようちゅうい",dot:"#f57c00"},
  crown:   {bg:"rgba(41,121,184,.8)", border:"#1a5a9a",label:"かぶせ物",   dot:"#2979b8"},
  missing: {bg:"rgba(110,110,110,.7)",border:"#888",   label:"欠損",       dot:"#9e9e9e"},
};
const TODAY_OPTIONS = ["歯のクリーニングです","むし歯の治療です","むし歯の予防（フッ素・シーラント）です"];
const NEXT_OPTIONS  = ["歯のクリーニング","むし歯の治療","むし歯の予防","歯みがきチェック","フッ素塗布","クリーニング","矯正チェック","シーラント"];

async function init() {
  const pid = new URLSearchParams(location.search).get("patient");
  if (!pid) { renderError("URLにカルテ番号が含まれていません。<br>QRコードから読み取ってください。"); return; }
  document.getElementById("heroSub").textContent = "カルテ番号: " + pid;
  let data = null;
  try {
    const res = await fetch(GAS_URL + "?action=getPatient&patientId=" + encodeURIComponent(pid));
    data = await res.json();
  } catch(e) { data = null; }
  if (!data || !data.patient) { renderError("データを読み込めませんでした。<br>しばらくしてから再度お試しください。"); return; }
  render(data.patient, data.latestRecord);
}

function formatDate(s) {
  if (!s) return {yyyy:"",mm:"",dd:""};
  const p = s.toString().split("T")[0].split("-");
  if (p.length===3) return {yyyy:p[0], mm:String(Number(p[1])), dd:String(Number(p[2]))};
  return {yyyy:"",mm:"",dd:""};
}

function render(p, rec) {
  document.getElementById("heroSub").textContent = p.name + " さん専用ノート";
  const dt = rec ? formatDate(rec.date) : {};
  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="card">
      <div class="card-head">👤 患者さん情報</div>
      <div class="card-body">
        <div class="pat-badge">
          <div class="pat-avatar">${(p.name||"?")[0]}</div>
          <div class="pat-info"><h2>${p.name}</h2><p>カルテ #${p.patientId}</p></div>
          ${dt.yyyy ? `<div class="visit-chip"><div class="vm">${dt.mm}月</div><div class="vd">${dt.dd}日</div><div class="vm">${dt.yyyy}</div></div>` : ""}
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-head">🦷 はのようす</div>
      <div class="card-body">
        <div class="teeth-wrap">
          <img class="teeth-img" id="teethImg" src="${TEETH_IMG_SRC}" alt="歯式図">
          <div class="teeth-overlay" id="teethOverlay"></div>
        </div>
        <div class="legend-row" id="legendRow"></div>
      </div>
    </div>
    ${rec ? `
    <div class="card">
      <div class="card-head">📋 きょうおこなったのは</div>
      <div class="card-body"><div class="chk-list" id="todayList"></div></div>
    </div>
    ${rec.clinicMessage ? `
    <div class="card">
      <div class="card-head">💬 先生からのメッセージ</div>
      <div class="card-body">
        <div class="clinic-tag">🏥 歯医者さんより</div>
        <div class="msg-bubble">${nl2br(rec.clinicMessage)}</div>
      </div>
    </div>` : ""}
    ${rec.nextPlan && rec.nextPlan.length ? `
    <div class="card">
      <div class="card-head">📅 つぎのちりょう予定</div>
      <div class="card-body"><div class="next-grid" id="nextList"></div></div>
    </div>` : ""}
    <div class="stamp"><span class="big">⭐</span>きょうもよくがんばりました！</div>
    ` : `<div class="warn-box">まだ記録がありません。<br>次回の来院をお待ちしています！</div>`}
  `;
  renderTeethOverlay(rec ? (rec.teethData||{}) : {});
  if (rec) {
    renderToday(rec.todayDone||[], rec.treatmentNote);
    if (rec.nextPlan && rec.nextPlan.length) renderNext(rec.nextPlan);
  }
}

function renderTeethOverlay(td) {
  const img = document.getElementById("teethImg");
  const overlay = document.getElementById("teethOverlay");
  const legend  = document.getElementById("legendRow");
  if (!overlay) return;
  function place() {
    overlay.innerHTML = "";
    const w = img.offsetWidth, h = img.offsetHeight;
    if (!w || !h) { setTimeout(place, 100); return; }
    Object.entries(TEETH_POS).forEach(([num, pos]) => {
      const s = td[num]; if (!s) return;
      const c = STATUS_COLOR[s];
      const el = document.createElement("div");
      el.className = "tooth-marker";
      el.setAttribute("data-s", s);
      el.style.left = (pos.cx/100*w)+"px";
      el.style.top  = (pos.cy/100*h)+"px";
      el.style.width = el.style.height = (pos.r/100*w*2)+"px";
      el.style.background = c.bg;
      el.style.borderColor = c.border;
      overlay.appendChild(el);
    });
    const used = [...new Set(Object.values(td))];
    legend.innerHTML = used.map(s => `<div class="leg"><div class="leg-dot" style="background:${STATUS_COLOR[s].dot}"></div>${STATUS_COLOR[s].label}</div>`).join("");
  }
  img.complete && img.naturalWidth ? place() : (img.onload = place);
  window.addEventListener("resize", place);
}

function renderToday(done, note) {
  const el = document.getElementById("todayList"); if (!el) return;
  TODAY_OPTIONS.forEach(opt => {
    const on = done.includes(opt);
    const d = document.createElement("div");
    d.className = "chk-item" + (on ? " on" : "");
    d.innerHTML = `<div class="chk-box ${on?"on":""}">${on?"✓":""}</div><span>${opt}</span>`;
    el.appendChild(d);
  });
  if (note) {
    const d = document.createElement("div");
    d.style.cssText = "margin-top:8px;padding:10px 12px;background:#fff3e0;border-radius:8px;border-left:4px solid #f4a35a;font-size:.88rem;line-height:1.65;color:#5a3a1a;";
    d.innerHTML = nl2br(note); el.appendChild(d);
  }
}

function renderNext(plan) {
  const el = document.getElementById("nextList"); if (!el) return;
  NEXT_OPTIONS.forEach(opt => {
    const on = plan.includes(opt);
    const d = document.createElement("div");
    d.className = "next-item" + (on ? " on" : "");
    d.innerHTML = `<div class="next-check ${on?"on":"off"}">${on?"✓":""}</div><span>${opt}</span>`;
    el.appendChild(d);
  });
}

function renderError(msg) {
  document.getElementById("heroSub").textContent = "エラー";
  document.getElementById("app").innerHTML = `<div class="err-box">${msg}</div>`;
}
function nl2br(s) { return (s||"").split("
").join("<br>"); }
init();
</script>
</body>
</html>
